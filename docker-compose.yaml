services:
  postgresql:
    image: postgres:12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASS}
      POSTGRES_DB: ${SQL_BASE}
    volumes:
      - ${HMDM_DATA_ROOT:-./volumes}/db:/var/lib/postgresql/data
    networks:
      - hmdm-backend

  hmdm:
    build:
      context: .
    image: hmdm-docker-deploy:0.1.9
    restart: unless-stopped
    depends_on:
      - postgresql
    ports:
      - "${HMDM_BIND_ADDRESS:-127.0.0.1}:${HMDM_HTTP_PORT:-18080}:8080"
      - "${HMDM_MQTT_PORT:-31000}:31000"
    volumes:
      - ${HMDM_DATA_ROOT:-./volumes}/work:/usr/local/tomcat/work
      - ${HMDM_DATA_ROOT:-./volumes}/hmdm-config:/usr/local/tomcat/conf/Catalina/localhost
      - ${HMDM_DATA_ROOT:-./volumes}/webapps:/usr/local/tomcat/webapps
    environment:
      SQL_HOST: postgresql
      SQL_PORT: 5432
      SQL_USER: ${SQL_USER}
      SQL_BASE: ${SQL_BASE}
      SQL_PASS: ${SQL_PASS}
      BASE_DOMAIN: ${BASE_DOMAIN}
      BASE_URL: ${BASE_URL}
      LOCAL_IP: ${LOCAL_IP}
      PROTOCOL: http
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SHARED_SECRET: ${SHARED_SECRET}
      HMDM_VARIANT: ${HMDM_VARIANT}
      DOWNLOAD_CREDENTIALS: ${DOWNLOAD_CREDENTIALS}
      HMDM_URL: ${HMDM_URL}
      CLIENT_VERSION: ${CLIENT_VERSION}
      FORCE_RECONFIGURE: ${FORCE_RECONFIGURE}
    networks:
      - hmdm-backend

networks:
  hmdm-backend:
    name: ${HMDM_NETWORK_NAME:-hmdm-backend}
    driver: bridge
